[production]
# What the settlement's main production order makes.
output = "planks"
# Further products with an order of their own.
more_outputs = ["beams", "panels", "dressed_stone", "keystones", "charcoal", "bricks", "pitch"]
# Most extra logs a production shortfall may ask gatherers for at once.
upstream_cap = 40

# ---------------------------------------------------------------------------
# Gathering sites: permanent, named places. Every tree inside `area`
# ([x0, y0, x1, y1], inclusive) belongs to the site. Trees deplete and regrow;
# a site's sustainable output is limited by how fast its trees recover.
# `regrow_pct` scales regrowth time for trees on that site.
# ---------------------------------------------------------------------------

[[sites]]
id = "starting_grove"
name = "Starting Grove"
area = [7, 6, 16, 13]
regrow_pct = 100

[[sites]]
id = "distant_forest"
name = "Distant Forest"
area = [28, 10, 45, 25]
# Older, richer woodland: oaks recover faster than in town.
regrow_pct = 75

# An old stand beyond the bridge, the far end of the map from Main Storage.
[[sites]]
id = "old_growth"
name = "Old Growth"
area = [28, 0, 47, 8]
regrow_pct = 100
# Far enough from home to be worth running as a production site of its own.
outpost = true

# More Ironwood beyond the eastern ravine. Nothing reaches it until a Forest
# Crossing is built. Spirits posted to Old Growth work here too.
[[sites]]
id = "hollow_grove"
name = "Hollow Grove"
area = [50, 0, 59, 10]
regrow_pct = 100
region = "old_growth"

# Stone south of home, a short walk from Main Storage.
[[sites]]
id = "south_quarry"
name = "South Quarry"
area = [2, 21, 12, 27]
regrow_pct = 100

# South of the river. Spirits won't work here.
[[sites]]
id = "far_shore"
name = "The Far Shore"
area = [0, 30, 47, 39]
regrow_pct = 100

# When a long walk is worth making. These stop spirits crossing the map for a
# handful of materials, and from drifting between far-apart benches.
[logistics]
long_trip_tiles = 16
# A free worker walks to a far bench only if it can make this many batches.
long_trip_batches = 4
# A carrier makes a long trip for at least this share of a full load, unless
# that's more than is wanted.
long_trip_load_pct = 100
# Goods this close to a pickup can join the same trip home.
batch_tiles = 6
# Haulers choose between carrying jobs by load, distance and urgency.
scored_carrying = true

[construction]
# Buildings that can wait on the plan at once.
queue_limit = 4
# A Workshop Annex works with a bench this many tiles away.
annex_reach = 3
# Room in Main Storage kept for raw materials. Without it, the hundreds of
# planks made training Woodworking can fill the store, and then no logs can
# come in for the buildings that would use them up.
raw_room = 100
# How long a road tile takes to cross, as a percentage of open ground. Spirits
# and the player both take 0.3 seconds on grass, so this makes it 0.2.
road_pct = 67
# How long spirits gather at the Hearth when it's lit, in seconds.
hearth_gathering_seconds = 180.0
homecoming_gap_seconds = 2.5
homecoming_limit_seconds = 600.0
moment_seconds = 600.0
moment_shown_seconds = 8.0
midwinter_seconds = 90.0
ice_area = [0, 28, 47, 29]
thaw_warning_seconds = 180.0
# How long a visitor waits for an answer, in game minutes.
visitor_patience_minutes = 10
visitor_gap_minutes = 30
# How often to look for anyone walled in, which older saves can contain.
stranded_check_seconds = 10.0

[gathering]
# Window for measured throughput and time-use shares.
measure_window_seconds = 120.0

[player]
move_seconds_per_tile = 0.25
carry_capacity = 28
# A gathering session moves to another tree at most this far, in tiles walked,
# so it never sets off across the map on its own.
gather_reach_tiles = 12
# How long a session stands by for a tree to regrow. If nothing will be ready
# in this time it stops and says so.
gather_wait_seconds = 120.0
# How long a crafting session stands by for spirits to bring what it needs.
craft_wait_seconds = 60.0

# ---------------------------------------------------------------------------
# Spirit roles. Each role lists prioritized job rules: every time a spirit
# finishes its task queue it picks the highest-priority job whose condition
# holds and which can actually be planned in the current world state.
#
# Conditions: always, inventory_full, carrying_any, objective_unmet,
#             outpost_stock_available, project_assigned, production_wanted,
#             workshop_needs_input, workshop_output_ready, output_unattended,
#             training_pickup_urgent, training_pickup_ready,
#             training_supply_urgent, training_supply_wanted
# Jobs:       gather, deliver, haul, construct, craft, supply, collect,
#             training_collect, training_supply
#
# The two "urgent" conditions only hold when the player has put training
# first, which is how that choice moves support above production.
# ---------------------------------------------------------------------------

[[roles]]
id = "woodcutter"
name = "Woodcutting Spirit"
skill = "woodcutting"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "nearest"
color = [0.35, 0.85, 0.45]
jobs = [
    { job = "deliver", priority = 100, when = "inventory_full" },
    { job = "gather", priority = 50, when = "objective_unmet" },
    { job = "deliver", priority = 20, when = "carrying_any" },
]

[[roles]]
id = "hauler"
name = "Hauling Spirit"
skill = "hauling"
move_seconds_per_tile = 0.3
carry_capacity = 15
capacity_per_level = 1
deliver_to = "main"
haul_min = 5
color = [0.95, 0.75, 0.30]
jobs = [
    { job = "deliver", priority = 100, when = "carrying_any" },
    { job = "training_collect", priority = 80, when = "training_pickup_urgent" },
    { job = "training_supply", priority = 75, when = "training_supply_urgent" },
    { job = "collect", priority = 70, when = "workshop_output_ready" },
    { job = "supply", priority = 60, when = "workshop_needs_input" },
    { job = "haul", priority = 50, when = "outpost_stock_available" },
    { job = "training_collect", priority = 45, when = "training_pickup_ready" },
    { job = "training_supply", priority = 40, when = "training_supply_wanted" },
]

[[roles]]
id = "builder"
name = "Construction Spirit"
skill = "construction"
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "nearest"
color = [0.55, 0.65, 1.0]
jobs = [
    { job = "construct", priority = 80, when = "project_assigned" },
    { job = "deliver", priority = 10, when = "carrying_any" },
]

[[roles]]
id = "woodworker"
name = "Woodworking Spirit"
skill = "woodworking"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "main"
color = [0.95, 0.55, 0.75]
# With a Hauling Spirit around it stays at the bench. Without one it fetches
# its own logs and carries its own planks.
jobs = [
    { job = "deliver", priority = 100, when = "carrying_any" },
    { job = "collect", priority = 60, when = "output_unattended" },
    { job = "craft", priority = 50, when = "production_wanted" },
]

[[roles]]
id = "quarrier"
name = "Quarrying Spirit"
skill = "quarrying"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "nearest"
color = [0.70, 0.74, 0.80]
jobs = [
    { job = "deliver", priority = 100, when = "inventory_full" },
    { job = "gather", priority = 50, when = "objective_unmet" },
    { job = "deliver", priority = 20, when = "carrying_any" },
]

[[roles]]
id = "mason"
name = "Masonry Spirit"
skill = "masonry"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "main"
color = [0.80, 0.78, 0.70]
jobs = [
    { job = "deliver", priority = 100, when = "carrying_any" },
    { job = "collect", priority = 60, when = "output_unattended" },
