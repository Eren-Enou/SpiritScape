# Old stones left by someone who was here before you. Walking up to one reads
# it. They can be found in any order, so each has to stand on its own.
[[markers]]
id = "first"
at = [2, 5]
title = "The Worn Stone"
text = "We came for the trees. I could cut more than anyone, so I gave the first of it away and made a helper. It was the best day."

[[markers]]
id = "river"
at = [18, 25]
title = "The River Stone"
text = "Ten helpers now. I don't remember how to sharpen an axe. They do it for me. It doesn't seem to matter."

[[markers]]
id = "forest"
at = [26, 12]
title = "The Leaning Stone"
text = "Someone asked me what I used to be good at. I went to answer, and found I had given it all away."

[[markers]]
id = "oldgrowth"
at = [45, 7]
title = "The Mossed Stone"
text = "The helpers never stop. They cut and carry and build, and they don't look up. I wonder if any of them remembers being me."

[[markers]]
id = "south"
at = [42, 24]
title = "The Split Stone"
text = "There is one thing left to give. I think if I give it, the work will go on without anyone to watch it. I think that's what I wanted."

[[markers]]
id = "shore"
at = [31, 35]
title = "The Shore Stone"
text = "They won't cross. I've watched them stop at the water and turn round. I come here when I want to be sure what's left of me is mine."

[[markers]]
id = "hollow"
at = [56, 9]
title = "The Last Stone"
text = "No name on this one. The chisel marks are very neat, the way a helper would make them. We built no hearth. Nobody was left who thought of it."

# The year, for real playthroughs only. Scenarios stay in a season-less world,
# so what they measure doesn't move. `growth` is how many ticks of regrowth a
# seasonal tree gets each tick: 2 is twice as fast, and 0 stops it.
[[seasons]]
id = "spring"
name = "Spring"
minutes = 30
growth = 2
text = "Spring. Everything that was cut grows back twice as fast."

[[seasons]]
id = "summer"
name = "Summer"
minutes = 30
growth = 1
text = "Summer. Long days, and the woods as they usually are."

[[seasons]]
id = "autumn"
name = "Autumn"
minutes = 30
growth = 1
text = "Autumn. Winter is coming: anything you want cut, cut it now."

[[seasons]]
id = "winter"
name = "Winter"
minutes = 30
growth = 0
text = "Winter. The woods have stopped growing. The quarry doesn't care, and neither does a bench."

# People who pass through a real game, in order, each once. Every offer costs
# something, and none should be simply good: turning one down has to make sense.
[[visitors]]
id = "pedlar"
name = "A pedlar"
after_minutes = 25
text = "\"Long road, thin axe handles. I'd pay well for good wood, if you've any to spare.\""
thanks = "The pedlar loads up and leaves you a sack of cut timber, more than you expected."
wants = [{ resource = "logs", amount = 40 }]
gives = [{ resource = "planks", amount = 15 }]
teaches = { skill = "woodcutting", xp = 150 }

[[visitors]]
id = "surveyor"
name = "A surveyor"
after_minutes = 70
needs_built = "outpost_storage"
text = "\"Fine country. I'm mapping the river. I could use planks for my stakes, and I'll leave you what I've quarried.\""
thanks = "The surveyor leaves a neat stack of stone at Main Storage."
wants = [{ resource = "planks", amount = 40 }]
gives = [{ resource = "stone", amount = 30 }]
teaches = { skill = "quarrying", xp = 300 }
ending_took = "The surveyor's map has this place on it now, spelled nearly right."
ending_refused = "There's a map somewhere with a blank where you are."

[[visitors]]
id = "shipwright"
name = "A shipwright"
after_minutes = 130
needs_built = "forest_crossing"
text = "\"That's Ironwood past your ravine. I'd give a lot for beams like those. I've panels from a yard that closed.\""
thanks = "The shipwright counts the beams twice, and leaves you the panels."
wants = [{ resource = "beams", amount = 20 }]
gives = [{ resource = "panels", amount = 40 }]
teaches = { skill = "woodworking", xp = 800 }

[[visitors]]
id = "mason"
name = "An old mason"
after_minutes = 200
needs_built = "mason_yard"
text = "\"Someone here knows stone. I can't lift it any more, but I can still cut a keystone. Bring me what I need.\""
thanks = "The old mason works through the night, and is gone by morning."
wants = [{ resource = "dressed_stone", amount = 20 }, { resource = "beams", amount = 10 }]
gives = [{ resource = "keystones", amount = 8 }]
teaches = { skill = "masonry", xp = 1500 }
ending_took = "There's a keystone out there with the old mason's mark on it, and you paid for it."
ending_refused = "The old mason never did cut that last keystone."

[[visitors]]
id = "pilgrim"
name = "A pilgrim"
after_minutes = 260
needs_built = "hearth_foundations"
text = "\"I walked a long way to see the stones. Nobody has ever started one of these. Could you spare what I need to get home?\""
thanks = "The pilgrim thanks you and doesn't look back. There's a small carved keystone on the step."
wants = [{ resource = "panels", amount = 30 }]
gives = [{ resource = "keystones", amount = 1 }]
ending_took = "The pilgrim got home."
ending_refused = "You never did find out if the pilgrim got home."

# Teaching each system when it first matters, in real games only. `opens` keeps
# a tab or skill off the screen until the tip has been said. See tips.rs for
# what `when` can say.
[[tips]]
id = "soul"
when = "phase:first_spirit"
opens = "soul"
text = "The Soul tab (R) has opened. Soul Separation trades your XP for a spirit that works for good."

[[tips]]
id = "progress"
when = "phase:first_spirit"
opens = "progress"
text = "The Progress tab (J) has opened. It keeps your long-term goals, and what you've found."

[[tips]]
id = "spirits"
when = "phase:first_craft"
opens = "spirits"
text = "The Spirits tab (O) has opened. You can give each spirit instructions, and read its story."

[[tips]]
id = "gathering"
when = "phase:first_craft"
opens = "gathering"
text = "The Gathering tab (G) has opened. It shows what each site gives, and why spirits are waiting."

[[tips]]
id = "woodworking"
when = "phase:first_craft"
opens = "woodworking"
text = "Woodworking is your second skill. Take logs from Main Storage and click the Workshop."

[[tips]]
id = "production"
when = "phase:automation"
opens = "production"
text = "The Production tab (P) has opened. It shows what's being made, and what's holding it up."

[[tips]]
id = "projects"
when = "phase:improvement"
opens = "projects"
text = "The Projects tab (B) has opened. Plan buildings there, and your spirits make what they need."

[[tips]]
id = "training"
when = "phase:return"
opens = "training"
text = "The Training tab (T) has opened. Spirits can carry for you while you train, and you can choose what to make."

[[tips]]
id = "outpost"
when = "level:woodcutting:10"
opens = "outpost"
text = "The Outpost tab (U) has opened. Ironwood is a long way from home, and a site out there can work on its own."

[[tips]]
id = "quarrying"
when = "phase:settled"
opens = "quarrying"
text = "There's stone south of home, past the Workshop. Quarrying is a skill of its own, and it starts from nothing."

[[tips]]
id = "masonry"
when = "caravans:3"
opens = "masonry"
text = "Masonry is your fourth skill: it joins stone to timber at a Mason's Yard."

[[tips]]
id = "first_winter"
when = "season:winter"
text = "The trees won't grow back until spring. It's a good time for the bench, the quarry or the plan."

# These come back only if something earlier went the right way. `remembers`
# names a visitor whose offer you took, and `refused` one you turned down.
[[visitors]]
id = "pedlar_returns"
name = "The pedlar, again"
after_minutes = 320
remembers = "pedlar"
text = "\"You dealt fair with me once. My daughter's marrying a joiner, and I've orders to fill, if you're still cutting.\""
thanks = "The pedlar pays above the odds, and asks after your spirits by name."
wants = [{ resource = "logs", amount = 120 }]
gives = [{ resource = "planks", amount = 60 }]
teaches = { skill = "woodcutting", xp = 1200 }
ending_took = "The pedlar's daughter married her joiner. There's a bench of yours at the wedding."

[[visitors]]
id = "surveyor_son"
name = "A surveyor's son"
after_minutes = 380
refused = "surveyor"
text = "\"My father said you turned him down, and that he'd have done the same. I've brought what he'd have left you. I only need planks for the road home.\""
thanks = "He stacks the stone neatly, the way his father would have."
wants = [{ resource = "planks", amount = 20 }]
gives = [{ resource = "stone", amount = 40 }]
teaches = { skill = "quarrying", xp = 600 }
ending_took = "The surveyor's son finished the map, and left a corner of it blank for you."

[[visitors]]
id = "shipwright_keel"
name = "The shipwright"
after_minutes = 440
remembers = "shipwright"
needs_built = "south_crossing"
text = "\"I've a keel to lay. I'd not ask if it weren't the last ship I'll build. Stone for the slip, and I'll send back what I can.\""
thanks = "The shipwright stays to watch the spirits work for a while, and doesn't say why."
wants = [{ resource = "dressed_stone", amount = 40 }]
gives = [{ resource = "beams", amount = 30 }]
teaches = { skill = "woodworking", xp = 2500 }
ending_took = "The last ship the shipwright ever built has your stone under it."

# These come either way. `knows` names someone earlier, and what they say
# depends on how that went.
[[visitors]]
id = "pilgrim_party"
name = "A party of pilgrims"
after_minutes = 540
needs_built = "hearth_foundations"
knows = "pilgrim"
text = "\"People say someone's raising a hearth out here. We didn't believe it, so we came to look. We've brought stone, and we only want planks for shelter.\""
text_took = "\"One of ours came home and said you'd helped when you didn't have to. We've carried stone all this way. We only want planks for shelter.\""
text_refused = "\"One of ours walked home from here with nothing, and told us to come anyway. We've carried stone all this way. We only want planks for shelter.\""
thanks = "The pilgrims stay three nights, and leave the stone stacked better than they found it."
wants = [{ resource = "planks", amount = 80 }]
gives = [{ resource = "dressed_stone", amount = 30 }]

[[visitors]]
id = "apprentice"
name = "A mason's apprentice"
after_minutes = 640
needs_built = "mason_yard"
knows = "mason"
text = "\"I'm told there's a yard out here that knows stone. Nobody's let me near a real job yet. Would you try me?\""
text_took = "\"The old mason died in the spring. The last thing they talked about was your yard, and that night's work. I'd like to do the same.\""
text_refused = "\"My master came here once, and you sent them away. They said you were right to. I'd like to change your mind.\""
thanks = "The apprentice works slowly, and checks each one twice."
wants = [{ resource = "dressed_stone", amount = 12 }]
gives = [{ resource = "keystones", amount = 2 }]
teaches = { skill = "masonry", xp = 1000 }
ending_took = "The apprentice still checks each one twice."

[[visitors]]
id = "wet_boots"
name = "A stranger with wet boots"
after_minutes = 760
needs_built = "still_lantern"
text = "\"You keep a light for the far shore. Nobody's done that in a long time. I want nothing for it. Well. A little stillwood, to take back where it came from.\""
thanks = "The stranger walks south. For a while the lantern burns steadier, or you think it does."
wants = [{ resource = "stillwood", amount = 10 }]
gives = [{ resource = "keystones", amount = 3 }]
ending_took = "You still don't know who that was."

[[visitors]]
id = "valley_child"
name = "A child from the valley"
after_minutes = 300
needs_built = "hearth_of_spirits"
text = "\"They say there's a fire here that spirits made. Is it true? Can I see one? My cart's got a broken board, too, if you've a plank or two to spare.\""
thanks = "The child watches a spirit work until it gets dark, and has to be called home twice."
wants = [{ resource = "planks", amount = 5 }]
ending_took = "The child from the valley came back the next year, and the year after."

