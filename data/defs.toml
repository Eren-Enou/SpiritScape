# SpiritScape game definitions.
#
# All durations are written in seconds and converted to simulation ticks at
# load time (see [simulation].ticks_per_second). Percentages are integers so
# that planner decisions stay fully deterministic.

[simulation]
ticks_per_second = 10
# How often an idle or blocked spirit re-evaluates its jobs.
idle_rethink_seconds = 0.5
event_log_capacity = 200

# How often the game writes the autosave, in real seconds. 0 turns it off.
# `--autosave SECONDS` overrides this.
[saves]
autosave_seconds = 120.0

# ---------------------------------------------------------------------------
# Progression profiles. Everything that sets the pace of personal progression
# lives here, and nowhere else: the rest of this file is the same in both.
#
# xp_table is the cumulative XP required for each level (index 0 is level 1),
# shared by every skill, for the player and for spirit competency. Keep the
# profile a world was started with: a spirit's level is read from its XP, so
# the same XP means a different level in another profile.
#
# See docs/V0.5_PROGRESSION.md for why the normal numbers are what they are.
# ---------------------------------------------------------------------------
[progression]
default_profile = "development"

[[progression.profiles]]
id = "development"
title = "Development"
description = "Fast rates for automated tests and experiments."
soul_min_xp = 100
xp_table = [
    0, 83, 174, 276, 388, 512, 650, 801, 969, 1154,
    1358, 1584, 1833, 2107, 2411, 2746, 3115, 3523, 3973, 4470,
]

[[progression.profiles]]
id = "normal"
title = "Normal"
description = "The pace intended for actual play."
soul_min_xp = 300
# Training a skill by hand makes plenty of its product, so improvements cost
# more here: otherwise hand-made planks pay for them before a spirit is needed.
improvement_cost_pct = 400
xp_table = [
    0, 120, 380, 900, 1800, 3600, 5800, 8500, 11800, 16000,
    21000, 27000, 34000, 42500, 52500, 64500, 79000, 96000, 116000, 140000,
]

# When the new-game guidance moves on. It never blocks anything.
[journey]
# Woodcutting level at which Soul Separation is first suggested.
first_spirit_level = 3
# Woodworking level to reach before the guidance suggests a Woodworking Spirit.
woodworking_level = 5

[[resources]]
id = "logs"
name = "Logs"

[[resources]]
id = "planks"
name = "Planks"

[[resources]]
id = "hardwood"
name = "Hardwood Logs"

[[resources]]
id = "beams"
name = "Structural Beams"

[[skills]]
id = "woodcutting"
name = "Woodcutting"
trainable = true

[[skills]]
id = "woodworking"
name = "Woodworking"
trainable = true

# Not trainable by the player yet; only used for seeded demonstration spirits.
[[skills]]
id = "hauling"
name = "Hauling"
trainable = false

[[skills]]
id = "construction"
name = "Construction"
trainable = false

# Woodcutting tiers. Both the player and spirits need `level_required` in
# the tree's skill to cut it. Numbers are tuned for quick playtesting.

[[tree_types]]
id = "tree"
name = "Tree"
map_char = "t"
resource = "logs"
skill = "woodcutting"
level_required = 1
logs = 3
regrow_seconds = 60.0
xp_per_log = 15
chop_seconds = 2.4
chop_seconds_per_level = 0.08
min_chop_seconds = 1.0

[[tree_types]]
id = "oak"
name = "Oak"
map_char = "T"
resource = "logs"
skill = "woodcutting"
level_required = 5
logs = 5
regrow_seconds = 240.0
xp_per_log = 30
chop_seconds = 3.0
chop_seconds_per_level = 0.1
min_chop_seconds = 0.8

# Slow to cut and slow to regrow, but it's the only source of Hardwood Logs.
[[tree_types]]
id = "ironwood"
name = "Ironwood"
map_char = "I"
resource = "hardwood"
skill = "woodcutting"
level_required = 10
logs = 6
regrow_seconds = 300.0
xp_per_log = 60
chop_seconds = 4.0
chop_seconds_per_level = 0.1
min_chop_seconds = 1.5

# ---------------------------------------------------------------------------
# Recipes: timed processing at a station building. The player and spirits use
# the same rules: `level_required` gates a recipe, and a worker always uses
# the best recipe its level and the available materials allow. The numbers
# are provisional, tuned for quick playtesting.
# ---------------------------------------------------------------------------

[[recipes]]
id = "rough_planks"
name = "Rough Planks"
skill = "woodworking"
station = "workshop"
level_required = 1
inputs = [{ resource = "logs", amount = 2 }]
output = { resource = "planks", amount = 1 }
craft_seconds = 3.0
craft_seconds_per_level = 0.1
min_craft_seconds = 1.2
xp = 25

# Better yield: 1.5 logs per plank instead of 2.
[[recipes]]
id = "precise_planks"
name = "Precise Planks"
skill = "woodworking"
station = "workshop"
level_required = 5
inputs = [{ resource = "logs", amount = 3 }]
output = { resource = "planks", amount = 2 }
craft_seconds = 4.0
craft_seconds_per_level = 0.1
min_craft_seconds = 1.8
xp = 45

# The first recipe that doesn't use ordinary logs at all.
[[recipes]]
id = "structural_beams"
name = "Structural Beams"
skill = "woodworking"
station = "workshop"
level_required = 10
inputs = [{ resource = "hardwood", amount = 2 }]
output = { resource = "beams", amount = 1 }
craft_seconds = 6.0
craft_seconds_per_level = 0.1
min_craft_seconds = 3.0
xp = 120

[production]
# What the settlement's main production order makes.
output = "planks"
# Further products with an order of their own.
more_outputs = ["beams"]
# Most extra logs a production shortfall may ask gatherers for at once.
upstream_cap = 40

# ---------------------------------------------------------------------------
# Gathering sites: permanent, named places. Every tree inside `area`
# ([x0, y0, x1, y1], inclusive) belongs to the site. Trees deplete and regrow;
# a site's sustainable output is limited by how fast its trees recover.
# `regrow_pct` scales regrowth time for trees on that site.
# ---------------------------------------------------------------------------

[[sites]]
id = "starting_grove"
name = "Starting Grove"
area = [7, 6, 16, 13]
regrow_pct = 100

[[sites]]
id = "distant_forest"
name = "Distant Forest"
area = [28, 10, 45, 25]
# Older, richer woodland: oaks recover faster than in town.
regrow_pct = 75

# An old stand beyond the bridge, the far end of the map from Main Storage.
[[sites]]
id = "old_growth"
name = "Old Growth"
area = [28, 0, 47, 8]
regrow_pct = 100

[gathering]
# Window for measured throughput and time-use shares.
measure_window_seconds = 120.0

[player]
move_seconds_per_tile = 0.25
carry_capacity = 28

# ---------------------------------------------------------------------------
# Spirit roles. Each role lists prioritized job rules: every time a spirit
# finishes its task queue it picks the highest-priority job whose condition
# holds and which can actually be planned in the current world state.
#
# Conditions: always, inventory_full, carrying_any, objective_unmet,
#             outpost_stock_available, project_assigned, production_wanted,
#             workshop_needs_input, workshop_output_ready, output_unattended,
#             training_pickup_urgent, training_pickup_ready,
#             training_supply_urgent, training_supply_wanted
# Jobs:       gather, deliver, haul, construct, craft, supply, collect,
#             training_collect, training_supply
#
# The two "urgent" conditions only hold when the player has put training
# first, which is how that choice moves support above production.
# ---------------------------------------------------------------------------

[[roles]]
id = "woodcutter"
name = "Woodcutting Spirit"
skill = "woodcutting"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "nearest"
color = [0.35, 0.85, 0.45]
jobs = [
    { job = "deliver", priority = 100, when = "inventory_full" },
    { job = "gather", priority = 50, when = "objective_unmet" },
    { job = "deliver", priority = 20, when = "carrying_any" },
]

[[roles]]
id = "hauler"
name = "Hauling Spirit"
skill = "hauling"
move_seconds_per_tile = 0.3
carry_capacity = 15
capacity_per_level = 1
deliver_to = "main"
haul_min = 5
color = [0.95, 0.75, 0.30]
jobs = [
    { job = "deliver", priority = 100, when = "carrying_any" },
    { job = "training_collect", priority = 80, when = "training_pickup_urgent" },
    { job = "training_supply", priority = 75, when = "training_supply_urgent" },
    { job = "collect", priority = 70, when = "workshop_output_ready" },
    { job = "supply", priority = 60, when = "workshop_needs_input" },
    { job = "haul", priority = 50, when = "outpost_stock_available" },
    { job = "training_collect", priority = 45, when = "training_pickup_ready" },
    { job = "training_supply", priority = 40, when = "training_supply_wanted" },
]

[[roles]]
id = "builder"
name = "Construction Spirit"
skill = "construction"
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "nearest"
color = [0.55, 0.65, 1.0]
jobs = [
    { job = "construct", priority = 80, when = "project_assigned" },
    { job = "deliver", priority = 10, when = "carrying_any" },
]

[[roles]]
id = "woodworker"
name = "Woodworking Spirit"
skill = "woodworking"
from_soul_separation = true
move_seconds_per_tile = 0.3
carry_capacity = 10
deliver_to = "main"
color = [0.95, 0.55, 0.75]
# With a Hauling Spirit around it stays at the bench. Without one it fetches
# its own logs and carries its own planks.
jobs = [
    { job = "deliver", priority = 100, when = "carrying_any" },
    { job = "collect", priority = 60, when = "output_unattended" },
    { job = "craft", priority = 50, when = "production_wanted" },
]

# ---------------------------------------------------------------------------
# Buildings
# ---------------------------------------------------------------------------

[[buildings]]
id = "main_storage"
name = "Main Storage"
map_char = "M"
is_main = true
capacity = 300
accepts_gatherer_deposits = true
color = [0.75, 0.55, 0.30]

[[buildings]]
id = "field_storage"
name = "Field Storage"
capacity = 40
accepts_gatherer_deposits = true
# The settlement planner may decide to build this on its own.
autonomous = true
max_count = 1
cost = [{ resource = "logs", amount = 15 }]
build_seconds = 15.0
build_seconds_per_level = 0.5
min_build_seconds = 5.0
color = [0.85, 0.65, 0.40]

# A station: recipes name it. Its storage holds up to `input_buffer` raw
# materials; the rest of `capacity` is room for finished goods.
[[buildings]]
id = "workshop"
name = "Workshop"
map_char = "K"
capacity = 40
input_buffer = 20
# Extra room for logs set aside for the player's own training. Production
# can't touch them.
training_buffer = 20
# Extra room for a second product's input and output.
extra_capacity = 40
# Workers (spirits or the player) that fit at once. Others wait or go elsewhere.
slots = 2
accepts_gatherer_deposits = false
# A further workshop is ordered by the player, and placed where they choose.
manual = true
max_count = 3
cost = [
    { resource = "logs", amount = 20 },
    { resource = "planks", amount = 20 },
    { resource = "beams", amount = 6 },
]
build_seconds = 25.0
build_seconds_per_level = 0.5
min_build_seconds = 10.0
color = [0.80, 0.60, 0.45]

# Requested by the player (`manual`), not by the planner. Adds its
# `capacity_bonus` to Main Storage when complete.
[[buildings]]
id = "storehouse"
name = "Storehouse"
capacity = 0
accepts_gatherer_deposits = false
manual = true
max_count = 3
capacity_bonus = 150
cost = [{ resource = "planks", amount = 20 }, { resource = "logs", amount = 10 }]
build_seconds = 20.0
build_seconds_per_level = 0.5
min_build_seconds = 8.0
color = [0.70, 0.55, 0.40]

# A drop-off point in the player's training area. The player fills it, and a
# Hauling Spirit empties it into Main Storage while support is on.
[[buildings]]
id = "training_cache"
name = "Training Cache"
capacity = 56
accepts_gatherer_deposits = false
manual = true
training_cache = true
max_count = 1
cost = [{ resource = "logs", amount = 15 }]
build_seconds = 12.0
build_seconds_per_level = 0.5
min_build_seconds = 5.0
color = [0.60, 0.70, 0.55]

# Racks beside the bench: each adds room for logs set aside for the player.
[[buildings]]
id = "log_rack"
name = "Log Rack"
capacity = 0
accepts_gatherer_deposits = false
manual = true
max_count = 2
training_bonus = 40
cost = [{ resource = "planks", amount = 10 }, { resource = "logs", amount = 10 }]
build_seconds = 10.0
build_seconds_per_level = 0.5
min_build_seconds = 4.0
color = [0.70, 0.60, 0.45]

[objective]
# "Maintain <target> <resource> in the main settlement storage."
resource = "logs"
target = 50

# ---------------------------------------------------------------------------
# Settlement planner: detects inefficient delivery routes and decides whether
# an autonomous building (field storage) would fix them.
# ---------------------------------------------------------------------------
[planner]
eval_interval_seconds = 5.0
# Number of recent gatherer deliveries averaged when judging route efficiency.
delivery_window = 3
# Older samples are ignored: the problem must be current.
max_sample_age_seconds = 240.0
# A route is inefficient when walking takes at least this share of a trip...
travel_share_threshold_pct = 40
# ...and the one-way delivery leg is at least this long.
min_leg_tiles = 16
# A candidate site must cut the estimated delivery leg by at least this much.
min_savings_pct = 50
site_search_radius = 6
# After rejecting or failing a plan, wait before re-evaluating.
reject_cooldown_seconds = 60.0
