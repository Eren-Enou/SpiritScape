# Starting scenarios. Normal gameplay and the development demonstration are
# kept separate: both use the same rules (defs.toml) and map, and differ only
# in starting state.
#
# Spawn markers refer to characters in the map file (H, B, W, P).

[new_game]
title = "New Game"
description = "Start with no Woodcutting XP. Chop trees, then use Soul Separation to create a Woodcutting Spirit."
objective_target = 50
plank_target = 30
log_reserve = 10
player_xp = {}
main_storage = {}
auto_gather = true
# Hauling and Construction skills do not exist yet, so the settlement starts
# with founding spirits for those roles. Given by level, because this scenario
# is played under both progression profiles.
spirits = [
    { role = "hauler", level = 5, spawn = "H" },
    { role = "builder", level = 5, spawn = "B" },
]

[demo]
title = "Demo: Autonomous Field Storage"
description = "A level 10 Woodcutting Spirit works toward a high log objective. The Starting Grove is reserved for your training, so it gathers in the Distant Forest. Watch the settlement detect long delivery routes and build a field storage."
objective_target = 150
player_xp = { woodcutting = 1500 }
main_storage = { logs = 20 }
spirits = [
    { role = "woodcutter", xp = 1154, spawn = "W" },
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "builder", xp = 388, spawn = "B" },
]
closed_sites = ["starting_grove"]

[regrind]
title = "Regrind"
description = "You are 28 XP short of cutting Oak. Train on Trees, unlock and cut Oak, then sacrifice at least 388 XP: you drop below Oak level, but your spirit keeps it permanently. Retrain on Trees while the spirit supplies the settlement."
objective_target = 60
player_xp = { woodcutting = 360 }
main_storage = { logs = 20 }
spirits = [
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "builder", xp = 388, spawn = "B" },
]

[grove_sustainable]
title = "Grove: sustainable"
description = "One level 5 Woodcutting Spirit works the Starting Grove (the Distant Forest is closed). Extraction stays below the grove's regrowth, so it rarely waits."
objective_target = 250
main_storage = { logs = 0 }
spirits = [
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "builder", xp = 388, spawn = "B" },
]
closed_sites = ["distant_forest"]

[grove_oversubscribed]
title = "Grove: oversubscribed"
description = "Four level 5 Woodcutting Spirits share the Starting Grove (the Distant Forest is closed). Extraction outpaces regrowth: watch the trees run out and the spirits wait."
objective_target = 250
main_storage = { logs = 0 }
spirits = [
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "builder", xp = 388, spawn = "B" },
]
closed_sites = ["distant_forest"]

# --- v0.4: the first workshop ----------------------------------------------

[workshop_manual]
title = "Workshop: manual"
description = "Train Woodworking by hand: click Main Storage to take logs, click the Workshop to saw planks (1 plank from 2 logs), then click Main Storage to store them. Precise Planks unlock at level 5. Then sacrifice Woodworking XP to create a Woodworking Spirit."
objective_target = 20
plank_target = 30
log_reserve = 10
player_xp = { woodworking = 300 }
main_storage = { logs = 80 }
spirits = [
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "builder", xp = 388, spawn = "B" },
]

[workshop_automated]
title = "Workshop: automated"
description = "Two Woodcutting Spirits, a Hauling Spirit and a level 5 Woodworking Spirit keep 30 Planks in Main Storage while keeping 20 Logs in reserve. Change the target or the reserve in the Production tab and watch the chain respond."
objective_target = 20
plank_target = 30
log_reserve = 20
main_storage = { logs = 30 }
spirits = [
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "woodworker", xp = 388, spawn = "B" },
    { role = "builder", xp = 388, spawn = "B" },
]

[workshop_construction]
title = "Workshop: construction"
description = "A Storehouse has been ordered. It costs 20 Planks and 10 Logs, and there are no Planks yet: the chain makes them, Main Storage reserves them, and the Construction Spirit builds it for +150 storage."
objective_target = 20
plank_target = 5
log_reserve = 10
main_storage = { logs = 40 }
spirits = [
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "woodcutter", xp = 388, spawn = "W" },
    { role = "hauler", xp = 388, spawn = "H" },
    { role = "woodworker", xp = 388, spawn = "B" },
    { role = "builder", xp = 388, spawn = "B" },
]
requested_buildings = ["storehouse"]

